name: Deployment (Container)
on:
  push:
    branches:
      - main
      - dev
env:
  CACHE_KEY: node-deps
  MONGODB_DB_NAME: gha-demo
jobs:
  test:
    environment: testing
    runs-on: ubuntu-latest  #runner machine image.
    #container: #the runs-on operating system will host this container 
    #  image: node:16
      #env: #container level environment vars
    env:
      MONGODB_CONNECTION_PROTOCOL: mongodb #check documentation, as its is connection and version specific
      MONGODB_CLUSTER_ADDRESS: 127.0.0.1:27017
      #MONGODB_CLUSTER_ADDRESS: mongodb #cluster0.wq5wzhj.mongodb.net. This 'mongodb' value works only in the case when the container image is running and services are used. docker will automatically create the donker networking environment for the containers to communicate
      MONGODB_USERNAME: root #${{ secrets.MONGODB_USERNAME }}
      MONGODB_PASSWORD: example #${{ secrets.MONGODB_PASSWORD }}
      PORT: 8080
    services:
      mongodb:
        image: mongo
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ env.CACHE_KEY }}-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Run server
        run: npm start & npx wait-on http://127.0.0.1:$PORT # requires MongoDB Atlas to accept requests from anywhere!
      - name: Run tests
        run: npm test
      - name: Output information
        run: |
          echo "MONGODB_USERNAME: $MONGODB_USERNAME"
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        env:
          PORT: 3000
        run: |        
          echo "MONGODB_DB_NAME: $MONGODB_DB_NAME"
          echo "MONGODB_USERNAME: $MONGODB_USERNAME"
          echo "${{ env.PORT }}"
